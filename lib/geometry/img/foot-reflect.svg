<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .lb{fill:#334155;font-size:12px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .ln{stroke:#334155;stroke-width:2}
  @media (prefers-color-scheme:dark){
    .tx,.lb{fill:#c9d1d9}.mn{fill:#8b949e}.ln{stroke:#c9d1d9}
  }
</style>

<!-- la recta l -->
<line class="ln" x1="40" y1="150" x2="330" y2="60"/>
<circle cx="90" cy="134" r="4" fill="#64748b"/><text class="lb" x="84" y="152">l.f</text>
<circle cx="265" cy="80" r="4" fill="#64748b"/><text class="lb" x="259" y="98">l.s</text>

<!-- p, foot, reflect -->
<circle cx="135" cy="42" r="4.5" fill="#2563eb"/>
<text class="lb" x="126" y="34" fill="#2563eb">p</text>

<!-- perpendicular de p a la recta -->
<line x1="135" y1="42" x2="173" y2="164" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="154" cy="103" r="4.5" fill="#059669"/>
<text class="lb" x="163" y="90" fill="#059669">foot(p, l)</text>
<circle cx="173" cy="164" r="4.5" fill="#dc2626"/>
<text class="lb" x="180" y="170" fill="#dc2626">reflect(p, l)</text>

<!-- marca de angulo recto -->
<path d="M150,91 L162,95 L158,107" stroke="#059669" stroke-width="1.3" fill="none"/>

<!-- llaves de distancias iguales -->
<text class="mn" x="118" y="76">d</text>
<text class="mn" x="150" y="140">d</text>

<!-- lineDist -->
<text class="tx" x="360" y="44">foot</text>
<text class="mn" x="360" y="62">la proyeccion de p sobre la</text>
<text class="mn" x="360" y="78">recta: el punto de l mas</text>
<text class="mn" x="360" y="94">cercano a p.</text>
<text class="tx" x="360" y="122">reflect</text>
<text class="mn" x="360" y="140">p espejado respecto de l.</text>
<text class="mn" x="360" y="156">foot es el punto medio entre</text>
<text class="mn" x="360" y="172">p y reflect(p, l).</text>
<text class="mn" x="360" y="192" font-weight="600">lineDist(p,l) = d</text>
</svg>
