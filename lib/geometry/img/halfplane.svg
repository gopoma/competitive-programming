<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 215" width="540" height="215" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  @media (prefers-color-scheme:dark){ .tx{fill:#c9d1d9}.mn{fill:#8b949e} }
</style>
<defs>
  <marker id="pA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
</defs>

<!-- un semiplano solo, explicado -->
<g>
  <path d="M30,120 L160,60 L160,20 L30,20 Z" fill="#2563eb" opacity="0.1"/>
  <line x1="24" y1="123" x2="166" y2="57" stroke="#2563eb" stroke-width="2.4" marker-end="url(#pA)"/>
  <circle cx="56" cy="108" r="4.5" fill="#2563eb"/>
  <text class="tx" x="42" y="102" fill="#2563eb">p</text>
  <text class="tx" x="152" y="44" fill="#2563eb">dp</text>
  <text class="tx" x="44" y="48" fill="#2563eb">IZQUIERDA</text>
  <text class="mn" x="24" y="156">Un semiplano se da como un rayo</text>
  <text class="mn" x="24" y="172">{p, dp}: el area valida es la que</text>
  <text class="mn" x="24" y="188">queda a su IZQUIERDA.</text>
</g>

<!-- la interseccion de varios -->
<g>
  <path d="M300,140 L390,160 L450,110 L430,52 L330,58 Z"
        fill="#059669" fill-opacity="0.16" stroke="#059669" stroke-width="2.2"/>
  <!-- rayos de soporte, extendidos -->
  <g stroke="#2563eb" stroke-width="1.5" opacity="0.75">
    <line x1="258" y1="131" x2="432" y2="170" marker-end="url(#pA)"/>
    <line x1="366" y1="176" x2="476" y2="84" marker-end="url(#pA)"/>
    <line x1="458" y1="132" x2="422" y2="26" marker-end="url(#pA)"/>
    <line x1="454" y1="46" x2="300" y2="56" marker-end="url(#pA)"/>
    <line x1="312" y1="40" x2="286" y2="162" marker-end="url(#pA)"/>
  </g>
  <text class="tx" x="352" y="112" fill="#059669">la interseccion</text>
</g>

<text class="mn" x="258" y="200">halfPlaneIsect devuelve los vertices de esa region, en CCW</text>
</svg>
