<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 215" width="540" height="215" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .lb{fill:#334155;font-size:12px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .ax{stroke:#cbd5e1;stroke-width:1}
  @media (prefers-color-scheme:dark){
    .tx,.lb{fill:#c9d1d9}.mn{fill:#8b949e}.ax{stroke:#30363d}
  }
</style>
<defs>
  <marker id="dG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
  <marker id="dB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
  <marker id="dR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
</defs>

<!-- panel 1: agudo -->
<g>
  <path class="ax" d="M20,160 H160 M20,160 V25"/>
  <path d="M60,145 L145,95" stroke="#059669" stroke-width="2.2" marker-end="url(#dG)"/>
  <path d="M60,145 L100,45" stroke="#059669" stroke-width="2.2" marker-end="url(#dG)"/>
  <path d="M85,131 A29,29 0 0,0 72,119" stroke="#059669" stroke-width="1.4" fill="none"/>
  <circle cx="60" cy="145" r="3.5" fill="#059669"/>
  <text class="lb" x="48" y="158">p</text>
  <text class="lb" x="150" y="94">a</text>
  <text class="lb" x="104" y="42">b</text>
  <text class="tx" x="20" y="186" fill="#059669">dot(p,a,b) &gt; 0</text>
  <text class="mn" x="20" y="202">angulo AGUDO en p</text>
</g>

<!-- panel 2: perpendicular -->
<g>
  <path class="ax" d="M200,160 H340 M200,160 V25"/>
  <path d="M250,140 L330,95" stroke="#2563eb" stroke-width="2.2" marker-end="url(#dB)"/>
  <path d="M250,140 L205,60" stroke="#2563eb" stroke-width="2.2" marker-end="url(#dB)"/>
  <path d="M263,133 L270,146 L257,153 L250,140 z" stroke="#2563eb" stroke-width="1.3" fill="none" transform="rotate(-150 250 140)"/>
  <circle cx="250" cy="140" r="3.5" fill="#2563eb"/>
  <text class="lb" x="238" y="154">p</text>
  <text class="lb" x="335" y="94">a</text>
  <text class="lb" x="196" y="54">b</text>
  <text class="tx" x="200" y="186" fill="#2563eb">dot(p,a,b) == 0</text>
  <text class="mn" x="200" y="202">PERPENDICULARES</text>
</g>

<!-- panel 3: obtuso -->
<g>
  <path class="ax" d="M380,160 H520 M380,160 V25"/>
  <path d="M460,130 L515,88" stroke="#dc2626" stroke-width="2.2" marker-end="url(#dR)"/>
  <path d="M460,130 L390,105" stroke="#dc2626" stroke-width="2.2" marker-end="url(#dR)"/>
  <path d="M434,121 A28,28 0 0,0 482,113" stroke="#dc2626" stroke-width="1.4" fill="none"/>
  <circle cx="460" cy="130" r="3.5" fill="#dc2626"/>
  <text class="lb" x="455" y="146">p</text>
  <text class="lb" x="508" y="82">a</text>
  <text class="lb" x="382" y="100">b</text>
  <text class="tx" x="380" y="186" fill="#dc2626">dot(p,a,b) &lt; 0</text>
  <text class="mn" x="380" y="202">angulo OBTUSO en p</text>
</g>
</svg>
