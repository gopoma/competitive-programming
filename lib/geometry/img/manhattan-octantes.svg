<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 235" width="540" height="235" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .ax{stroke:#94a3b8;stroke-width:1.2}
  .di{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 3}
  @media (prefers-color-scheme:dark){
    .tx{fill:#c9d1d9}.mn{fill:#8b949e}.ax{stroke:#6e7681}.di{stroke:#30363d}
  }
</style>

<!-- el octante destacado: entre el eje +x y la diagonal de 45 grados -->
<path d="M130,118 L218,118 L218,30 Z" fill="#2563eb" opacity="0.13"/>

<!-- ejes y diagonales: los 8 octantes -->
<line class="ax" x1="42" y1="118" x2="222" y2="118"/>
<line class="ax" x1="130" y1="206" x2="130" y2="30"/>
<line class="di" x1="46" y1="202" x2="214" y2="34"/>
<line class="di" x1="46" y1="34" x2="214" y2="202"/>

<circle cx="130" cy="118" r="4.5" fill="#dc2626"/>
<text class="tx" x="112" y="134" fill="#dc2626">p</text>

<!-- el vecino mas cercano del octante: el unico que puede estar en el MST -->
<circle cx="162" cy="106" r="4.5" fill="#059669"/>
<line x1="130" y1="118" x2="162" y2="106" stroke="#059669" stroke-width="2"/>
<text class="mn" x="166" y="100" fill="#059669">el mas cercano</text>

<!-- los demas del mismo octante -->
<circle cx="192" cy="80" r="3.5" fill="#94a3b8"/>
<circle cx="208" cy="98" r="3.5" fill="#94a3b8"/>
<circle cx="205" cy="68" r="3.5" fill="#94a3b8"/>
<text class="mn" x="60" y="226" fill="#94a3b8">los demas del octante no entran en el MST</text>

<text class="tx" x="280" y="46">Por que alcanzan 4N aristas</text>
<text class="mn" x="280" y="70">El plano se parte en 8 octantes</text>
<text class="mn" x="280" y="86">alrededor de cada punto p.</text>
<text class="mn" x="280" y="110">Dentro de un octante, SOLO el</text>
<text class="mn" x="280" y="126">vecino mas cercano puede estar</text>
<text class="mn" x="280" y="142">en un MST: cualquier otro forma</text>
<text class="mn" x="280" y="158">un ciclo con una arista mas corta.</text>
<text class="mn" x="280" y="182">Las 4 vueltas del bucle cubren los</text>
<text class="mn" x="280" y="198">8 octantes por simetria, y cada una</text>
<text class="mn" x="280" y="214">aporta a lo sumo 1 arista por punto.</text>
</svg>
