<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .pn{fill:none;stroke:#e2e8f0;stroke-width:1.2}
  .gl{stroke:#94a3b8;stroke-width:1.2}
  .dot{fill:#94a3b8}
  @media (prefers-color-scheme:dark){
    .tx{fill:#c9d1d9}.mn{fill:#8b949e}.pn{stroke:#30363d}.gl{stroke:#6e7681}.dot{fill:#6e7681}
  }
</style>

<!-- ============ 1. hull de colineales ============ -->
<rect class="pn" x="10" y="10" width="260" height="185" rx="8"/>
<text class="tx" x="22" y="32">hull de colineales</text>
<rect x="186" y="20" width="76" height="18" rx="9" fill="#2563eb"/>
<text x="224" y="33" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">2 VÉRTICES</text>
<line x1="40" y1="160" x2="220" y2="60" stroke="#059669" stroke-width="2.5"/>
<circle class="dot" cx="85" cy="135" r="4"/>
<circle class="dot" cx="130" cy="110" r="4"/>
<circle class="dot" cx="175" cy="85" r="4"/>
<circle cx="40" cy="160" r="6" fill="#059669"/>
<circle cx="220" cy="60" r="6" fill="#059669"/>
<text class="mn" x="150" y="150">los del medio</text>
<text class="mn" x="150" y="164">se descartan</text>
<text class="tx" x="22" y="186" font-size="12">sz(h) = 2 — chequeá sz(h) &gt;= 3</text>

<!-- ============ 2. poligono no simple ============ -->
<rect class="pn" x="290" y="10" width="260" height="185" rx="8"/>
<text class="tx" x="302" y="32">polígono no simple</text>
<rect x="466" y="20" width="76" height="18" rx="9" fill="#dc2626"/>
<text x="504" y="33" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">SILENCIOSO</text>
<polygon points="340,150 428,150 384,106" fill="#059669" opacity="0.22"/>
<polygon points="384,106 340,62 428,62" fill="#dc2626" opacity="0.22"/>
<polyline points="340,150 428,150 340,62 428,62 340,150" fill="none" stroke="#334155" stroke-width="2"/>
<text x="384" y="140" fill="#059669" font-size="13" font-weight="700" text-anchor="middle">+A</text>
<text x="384" y="82" fill="#dc2626" font-size="13" font-weight="700" text-anchor="middle">−A</text>
<circle cx="340" cy="150" r="3.5" fill="#334155"/>
<text class="mn" x="336" y="166" text-anchor="end">inicio</text>
<text class="mn" x="442" y="90">las aristas</text>
<text class="mn" x="442" y="104">se cruzan:</text>
<text class="mn" x="442" y="118">+A y −A</text>
<text class="mn" x="442" y="132">se anulan</text>
<text x="302" y="184" fill="#dc2626" font-size="12" font-weight="700">cenArea: área 0, centro (nan, −inf)</text>

<!-- ============ 3. region no acotada ============ -->
<rect class="pn" x="10" y="205" width="260" height="185" rx="8"/>
<text class="tx" x="22" y="227">región abierta</text>
<rect x="186" y="215" width="76" height="18" rx="9" fill="#dc2626"/>
<text x="224" y="228" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">SILENCIOSO</text>
<rect x="30" y="256" width="90" height="50" fill="#2563eb" opacity="0.07"/>
<rect x="120" y="256" width="90" height="50" fill="#2563eb" opacity="0.2"/>
<line class="gl" x1="24" y1="256" x2="232" y2="256"/>
<line class="gl" x1="24" y1="306" x2="232" y2="306"/>
<line x1="210" y1="246" x2="210" y2="316" stroke="#2563eb" stroke-width="2"/>
<text x="40" y="286" fill="#dc2626" font-size="16" font-weight="700">← ∞</text>
<text x="22" y="334" fill="#dc2626" font-size="12" font-weight="700">halfPlaneIsect → (inf, nan)</text>
<text x="22" y="352" fill="#059669" font-size="12" font-weight="600">add_bounds = true: se acota</text>
<text class="mn" x="22" y="368">a la caja [0, 1e9] × [0, 1e9]</text>

<!-- ============ 4. tangent con el punto adentro ============ -->
<rect class="pn" x="290" y="205" width="260" height="185" rx="8"/>
<text class="tx" x="302" y="227">punto adentro</text>
<rect x="466" y="215" width="76" height="18" rx="9" fill="#dc2626"/>
<text x="504" y="228" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">SILENCIOSO</text>
<polygon points="320,340 410,340 410,250 320,250" fill="#2563eb" opacity="0.1" stroke="#2563eb" stroke-width="2"/>
<circle cx="365" cy="295" r="5" fill="#dc2626"/>
<text x="373" y="309" fill="#dc2626" font-size="11">b</text>
<line x1="365" y1="295" x2="320" y2="250" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3"/>
<circle cx="320" cy="250" r="5" fill="#dc2626"/>
<text x="314" y="246" fill="#dc2626" font-size="11" text-anchor="end">3</text>
<text class="mn" x="424" y="270">devuelve 3:</text>
<text class="mn" x="424" y="284">un índice válido</text>
<text class="mn" x="424" y="298">del polígono,</text>
<text class="mn" x="424" y="312">pero sin sentido</text>
<text x="302" y="372" fill="#dc2626" font-size="12" font-weight="700">nada avisa que b está adentro</text>
</svg>
