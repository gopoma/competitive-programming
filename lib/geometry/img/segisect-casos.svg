<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:12px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .a{stroke:#2563eb;stroke-width:2.4}
  .b{stroke:#64748b;stroke-width:2.4}
  @media (prefers-color-scheme:dark){
    .tx{fill:#c9d1d9}.mn{fill:#8b949e}.b{stroke:#8b949e}
  }
</style>

<!-- 1: cruce propio -->
<g>
  <line class="a" x1="20" y1="100" x2="110" y2="40"/>
  <line class="b" x1="25" y1="45" x2="105" y2="100"/>
  <circle cx="66" cy="70" r="5" fill="#059669"/>
  <text class="tx" x="20" y="142" fill="#059669">1 punto</text>
  <text class="mn" x="20" y="158">cruce propio</text>
  <text class="mn" x="20" y="174">strictIsect lo encuentra</text>
</g>

<!-- 2: se tocan en un extremo -->
<g>
  <line class="a" x1="150" y1="100" x2="230" y2="60"/>
  <line class="b" x1="230" y1="60" x2="248" y2="105"/>
  <circle cx="230" cy="60" r="5" fill="#059669"/>
  <text class="tx" x="150" y="142" fill="#059669">1 punto</text>
  <text class="mn" x="150" y="158">se tocan en un extremo</text>
  <text class="mn" x="150" y="174">strictIsect da VACIO</text>
</g>

<!-- 3: colineales solapados -->
<g>
  <line class="a" x1="280" y1="80" x2="380" y2="55"/>
  <line class="b" x1="330" y1="67.5" x2="410" y2="47.5" stroke-dasharray="0"/>
  <line x1="330" y1="67.5" x2="380" y2="55" stroke="#059669" stroke-width="5" opacity="0.5"/>
  <circle cx="330" cy="67.5" r="5" fill="#059669"/>
  <circle cx="380" cy="55" r="5" fill="#059669"/>
  <text class="tx" x="280" y="142" fill="#059669">2 puntos</text>
  <text class="mn" x="280" y="158">colineales, se SOLAPAN</text>
  <text class="mn" x="280" y="174">devuelve los dos extremos</text>
</g>

<!-- 4: no se tocan -->
<g>
  <line class="a" x1="440" y1="100" x2="500" y2="70"/>
  <line class="b" x1="455" y1="48" x2="520" y2="42"/>
  <text class="tx" x="440" y="142" fill="#dc2626">vacio</text>
  <text class="mn" x="440" y="158">no se tocan</text>
</g>
</svg>
