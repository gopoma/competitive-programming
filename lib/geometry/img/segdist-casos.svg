<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 225" width="540" height="225" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .lb{fill:#334155;font-size:12px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .seg{stroke:#334155;stroke-width:2.4}
  @media (prefers-color-scheme:dark){
    .tx,.lb{fill:#c9d1d9}.mn{fill:#8b949e}.seg{stroke:#c9d1d9}
  }
</style>

<!-- panel 1: la proyeccion cae ANTES de A -->
<g>
  <line class="seg" x1="60" y1="130" x2="150" y2="130"/>
  <circle cx="60" cy="130" r="4" fill="#64748b"/><circle cx="150" cy="130" r="4" fill="#64748b"/>
  <text class="lb" x="54" y="148">A</text><text class="lb" x="146" y="148">B</text>
  <circle cx="28" cy="62" r="4" fill="#dc2626"/>
  <text class="lb" x="18" y="56">p</text>
  <line x1="28" y1="62" x2="60" y2="130" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="28" y1="62" x2="28" y2="130" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="28" cy="130" r="3" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <text class="mn" x="8" y="146">foot</text>
  <text class="tx" x="14" y="182">dot(A,p,B) &lt;= 0</text>
  <text class="mn" x="14" y="198">cae ANTES de A</text>
  <text class="mn" x="14" y="212" fill="#dc2626">dist = |p - A|</text>
</g>

<!-- panel 2: la proyeccion cae DENTRO -->
<g>
  <line class="seg" x1="230" y1="130" x2="340" y2="130"/>
  <circle cx="230" cy="130" r="4" fill="#64748b"/><circle cx="340" cy="130" r="4" fill="#64748b"/>
  <text class="lb" x="224" y="148">A</text><text class="lb" x="336" y="148">B</text>
  <circle cx="290" cy="62" r="4" fill="#059669"/>
  <text class="lb" x="284" y="56">p</text>
  <line x1="290" y1="62" x2="290" y2="130" stroke="#059669" stroke-width="2.2"/>
  <path d="M290,118 L302,118 L302,130" stroke="#059669" stroke-width="1.3" fill="none"/>
  <circle cx="290" cy="130" r="3.5" fill="#059669"/>
  <text class="mn" x="296" y="146">foot</text>
  <text class="tx" x="214" y="182">los dos dot &gt; 0</text>
  <text class="mn" x="214" y="198">cae DENTRO del segmento</text>
  <text class="mn" x="214" y="212" fill="#059669">dist = lineDist(p, AB)</text>
</g>

<!-- panel 3: la proyeccion cae DESPUES de B -->
<g>
  <line class="seg" x1="400" y1="130" x2="490" y2="130"/>
  <circle cx="400" cy="130" r="4" fill="#64748b"/><circle cx="490" cy="130" r="4" fill="#64748b"/>
  <text class="lb" x="394" y="148">A</text><text class="lb" x="486" y="148">B</text>
  <circle cx="522" cy="62" r="4" fill="#dc2626"/>
  <text class="lb" x="516" y="56">p</text>
  <line x1="522" y1="62" x2="490" y2="130" stroke="#dc2626" stroke-width="2.2"/>
  <line x1="522" y1="62" x2="522" y2="130" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="522" cy="130" r="3" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
  <text class="mn" x="508" y="146">foot</text>
  <text class="tx" x="386" y="182">dot(B,p,A) &lt;= 0</text>
  <text class="mn" x="386" y="198">cae DESPUES de B</text>
  <text class="mn" x="386" y="212" fill="#dc2626">dist = |p - B|</text>
</g>
</svg>
