<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .pn{fill:none;stroke:#e2e8f0;stroke-width:1.2}
  .gl{stroke:#94a3b8;stroke-width:1.2}
  .ci{fill:none;stroke:#2563eb;stroke-width:2}
  @media (prefers-color-scheme:dark){
    .tx{fill:#c9d1d9}.mn{fill:#8b949e}.pn{stroke:#30363d}.gl{stroke:#6e7681}.ci{stroke:#58a6ff}
  }
</style>

<!-- ============ 1. tangent desde adentro ============ -->
<rect class="pn" x="10" y="10" width="260" height="185" rx="8"/>
<text class="tx" x="22" y="32">tangent: x adentro</text>
<rect x="186" y="20" width="76" height="18" rx="9" fill="#dc2626"/>
<text x="224" y="33" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">SILENCIOSO</text>
<circle class="ci" cx="80" cy="112" r="52"/>
<circle cx="80" cy="112" r="2.5" fill="#2563eb"/>
<circle cx="100" cy="124" r="5" fill="#dc2626"/>
<text x="108" y="128" fill="#dc2626" font-size="11">x</text>
<text x="148" y="82" fill="#dc2626" font-size="12" font-weight="700">(nan, nan)</text>
<text class="mn" x="148" y="100">sqrt(d² − r²)</text>
<text class="mn" x="148" y="114">con d &lt; r</text>
<text class="mn" x="22" y="186">desde adentro no hay tangente</text>

<!-- ============ 2. x calculado sobre el borde ============ -->
<rect class="pn" x="290" y="10" width="260" height="185" rx="8"/>
<text class="tx" x="302" y="32">x calculado en borde</text>
<rect x="466" y="20" width="76" height="18" rx="9" fill="#059669"/>
<text x="504" y="33" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">OK</text>
<circle class="ci" cx="350" cy="108" r="46"/>
<circle cx="390" cy="85" r="4.5" fill="#059669"/>
<line class="gl" x1="394" y1="82" x2="460" y2="66" stroke-dasharray="3 3"/>
<circle cx="490" cy="80" r="30" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
<path d="M 466 104 Q 486 80 510 58" class="ci"/>
<circle cx="482" cy="92" r="4" fill="#059669"/>
<text class="mn" x="490" y="126" text-anchor="middle">zoom: apenas</text>
<text class="mn" x="490" y="140" text-anchor="middle">adentro</text>
<text x="302" y="170" fill="#059669" font-size="12" font-weight="700">devuelve x: tolerancia relativa</text>
<text class="mn" x="302" y="186">más adentro que 5e-10 · r: sigue nan</text>

<!-- ============ 3. external con un circulo dentro del otro ============ -->
<rect class="pn" x="10" y="205" width="260" height="185" rx="8"/>
<text class="tx" x="22" y="227">uno dentro del otro</text>
<rect x="186" y="215" width="76" height="18" rx="9" fill="#dc2626"/>
<text x="224" y="228" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">SILENCIOSO</text>
<circle class="ci" cx="80" cy="305" r="55"/>
<circle cx="92" cy="305" r="20" fill="none" stroke="#7c3aed" stroke-width="2"/>
<text x="150" y="262" fill="#dc2626" font-size="12" font-weight="700">2 pares de</text>
<text x="150" y="278" fill="#dc2626" font-size="12" font-weight="700">(nan, nan)</text>
<text class="mn" x="150" y="298">no existe tangente</text>
<text class="mn" x="150" y="312">común: devuelve</text>
<text class="mn" x="150" y="326">nan, no vacío</text>
<text class="mn" x="22" y="382">chequeá d &gt; |r1 − r2| antes de llamar</text>

<!-- ============ 4. ccCenter con colineales ============ -->
<rect class="pn" x="290" y="205" width="260" height="185" rx="8"/>
<text class="tx" x="302" y="227">3 colineales</text>
<rect x="466" y="215" width="76" height="18" rx="9" fill="#d97706"/>
<text x="504" y="228" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">ASSERT</text>
<line class="gl" x1="305" y1="330" x2="535" y2="258" stroke-dasharray="4 3"/>
<circle cx="330" cy="322" r="5.5" fill="#d97706"/>
<circle cx="420" cy="294" r="5.5" fill="#d97706"/>
<circle cx="510" cy="266" r="5.5" fill="#d97706"/>
<text class="mn" x="330" y="342" text-anchor="middle">a</text>
<text class="mn" x="420" y="314" text-anchor="middle">b</text>
<text class="mn" x="510" y="286" text-anchor="middle">c</text>
<text x="302" y="360" fill="#d97706" font-size="12" font-weight="700">ccCenter → assert</text>
<text class="mn" x="302" y="378">el radio sería infinito: no hay círculo</text>
</svg>
