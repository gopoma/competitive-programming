<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 185" width="540" height="185" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:12px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .c{fill:none;stroke:#64748b;stroke-width:2}
  @media (prefers-color-scheme:dark){
    .tx{fill:#c9d1d9}.mn{fill:#8b949e}.c{stroke:#8b949e}
  }
</style>

<!-- 1: dos puntos -->
<g>
  <circle class="c" cx="52" cy="68" r="36"/>
  <circle class="c" cx="98" cy="68" r="36"/>
  <circle cx="75" cy="40" r="5" fill="#059669"/>
  <circle cx="75" cy="96" r="5" fill="#059669"/>
  <text class="tx" x="14" y="134" fill="#059669">2 puntos</text>
  <text class="mn" x="14" y="150">se cortan de verdad</text>
</g>

<!-- 2: tangentes -->
<g>
  <circle class="c" cx="186" cy="68" r="34"/>
  <circle class="c" cx="256" cy="68" r="36"/>
  <circle cx="220" cy="68" r="5" fill="#2563eb"/>
  <text class="tx" x="150" y="134" fill="#2563eb">2 puntos IGUALES</text>
  <text class="mn" x="150" y="150">tangentes: el punto</text>
  <text class="mn" x="150" y="164">viene repetido</text>
</g>

<!-- 3: disjuntos -->
<g>
  <circle class="c" cx="352" cy="68" r="28"/>
  <circle class="c" cx="424" cy="68" r="26"/>
  <text class="tx" x="330" y="134" fill="#dc2626">vacio</text>
  <text class="mn" x="330" y="150">disjuntos</text>
</g>

<!-- 4: uno contenido en el otro -->
<g>
  <circle class="c" cx="502" cy="68" r="30"/>
  <circle class="c" cx="508" cy="72" r="14"/>
  <text class="tx" x="464" y="134" fill="#dc2626">vacio tambien</text>
  <text class="mn" x="464" y="150">uno adentro del otro</text>
</g>
</svg>
