<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" width="540" height="210" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .c{fill:none;stroke:#64748b;stroke-width:2}
  @media (prefers-color-scheme:dark){
    .tx{fill:#c9d1d9}.mn{fill:#8b949e}.c{stroke:#8b949e}
  }
</style>

<!-- EXTERNAS: los dos circulos quedan del mismo lado -->
<g>
  <circle class="c" cx="80" cy="85" r="38"/>
  <circle class="c" cx="200" cy="85" r="22"/>
  <circle cx="80" cy="85" r="2.5" fill="#64748b"/><circle cx="200" cy="85" r="2.5" fill="#64748b"/>
  <!-- tangente externa de arriba y de abajo (radios 38 y 22, dx=120) -->
  <line x1="75" y1="47" x2="197" y2="63" stroke="#059669" stroke-width="2"/>
  <line x1="75" y1="123" x2="197" y2="107" stroke="#059669" stroke-width="2"/>
  <circle cx="75" cy="47" r="4" fill="#059669"/><circle cx="197" cy="63" r="4" fill="#059669"/>
  <circle cx="75" cy="123" r="4" fill="#059669"/><circle cx="197" cy="107" r="4" fill="#059669"/>
  <text class="tx" x="30" y="170" fill="#059669">external(x, y)</text>
  <text class="mn" x="30" y="188">los dos circulos quedan del</text>
  <text class="mn" x="30" y="202">MISMO lado de la tangente</text>
</g>

<!-- INTERNAS: pasan entre los dos y se cruzan -->
<g>
  <circle class="c" cx="350" cy="85" r="38"/>
  <circle class="c" cx="470" cy="85" r="22"/>
  <circle cx="350" cy="85" r="2.5" fill="#64748b"/><circle cx="470" cy="85" r="2.5" fill="#64748b"/>
  <line x1="333" y1="51" x2="480" y2="105" stroke="#dc2626" stroke-width="2"/>
  <line x1="333" y1="119" x2="480" y2="65" stroke="#dc2626" stroke-width="2"/>
  <circle cx="333" cy="51" r="4" fill="#dc2626"/><circle cx="480" cy="105" r="4" fill="#dc2626"/>
  <circle cx="333" cy="119" r="4" fill="#dc2626"/><circle cx="480" cy="65" r="4" fill="#dc2626"/>
  <circle cx="394" cy="85" r="3" fill="#dc2626" opacity="0.6"/>
  <text class="tx" x="310" y="170" fill="#dc2626">internal(x, y)</text>
  <text class="mn" x="310" y="188">pasan ENTRE los dos y se</text>
  <text class="mn" x="310" y="202">cruzan; solo si no se cortan</text>
</g>
</svg>
