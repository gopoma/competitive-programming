<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 242" width="540" height="242" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:12px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .pg{fill:#64748b;fill-opacity:0.07;stroke:#64748b;stroke-width:1.9}
  @media (prefers-color-scheme:dark){
    .tx{fill:#c9d1d9}.mn{fill:#8b949e}.pg{stroke:#8b949e}
  }
</style>

<!-- caso .f = 1 : todos los vertices de un lado -->
<g>
  <path class="pg" d="M40,120 L110,130 L140,85 L100,48 L46,66 Z"/>
  <line x1="20" y1="162" x2="165" y2="162" stroke="#2563eb" stroke-width="2.2"/>
  <circle cx="110" cy="130" r="5" fill="#2563eb"/>
  <text class="tx" x="20" y="186" fill="#2563eb">.f = 1</text>
  <text class="mn" x="20" y="200">todos de un lado</text>
</g>

<!-- caso .f = -1 : todos del otro -->
<g>
  <path class="pg" d="M210,120 L280,130 L310,85 L270,48 L216,66 Z"/>
  <line x1="190" y1="28" x2="335" y2="28" stroke="#dc2626" stroke-width="2.2"/>
  <circle cx="270" cy="48" r="5" fill="#dc2626"/>
  <text class="tx" x="190" y="186" fill="#dc2626">.f = -1</text>
  <text class="mn" x="190" y="200">todos del otro</text>
</g>

<!-- caso .f = 0 : la recta atraviesa -->
<g>
  <path class="pg" d="M380,120 L450,130 L480,85 L440,48 L386,66 Z"/>
  <line x1="360" y1="108" x2="505" y2="78" stroke="#059669" stroke-width="2.2"/>
  <circle cx="382" cy="104" r="5" fill="#059669"/>
  <circle cx="474" cy="85" r="5" fill="#059669"/>
  <text class="tx" x="360" y="186" fill="#059669">.f = 0</text>
  <text class="mn" x="360" y="200">la recta ATRAVIESA</text>
</g>

<text class="mn" x="20" y="220">en los dos primeros .s trae los vertices MAS CERCANOS a la recta;  en el tercero,</text>
<text class="mn" x="20" y="234">el rango de vertices que quedan de un lado</text>
</svg>
