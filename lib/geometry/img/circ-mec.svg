<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 200" width="540" height="200" font-family="ui-sans-serif,system-ui,-apple-system,sans-serif">
<style>
  .tx{fill:#334155;font-size:13px;font-weight:600}
  .mn{fill:#64748b;font-size:11px}
  .pt{fill:#64748b}
  @media (prefers-color-scheme:dark){
    .tx{fill:#c9d1d9}.mn{fill:#8b949e}.pt{fill:#8b949e}
  }
</style>

<!-- caso 2 puntos: el diametro -->
<g>
  <circle cx="120" cy="80" r="52" fill="#2563eb" opacity="0.07"/>
  <circle cx="120" cy="80" r="52" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="78" y1="110" x2="162" y2="50" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3"/>
  <circle cx="78" cy="110" r="5" fill="#2563eb"/>
  <circle cx="162" cy="50" r="5" fill="#2563eb"/>
  <circle class="pt" cx="110" cy="70" r="3.5"/>
  <circle class="pt" cx="140" cy="95" r="3.5"/>
  <circle class="pt" cx="100" cy="100" r="3.5"/>
  <circle cx="120" cy="80" r="2.5" fill="#2563eb"/>
  <text class="tx" x="55" y="166" fill="#2563eb">2 puntos en el borde</text>
  <text class="mn" x="55" y="182">son los extremos de un diametro</text>
</g>

<!-- caso 3 puntos: el circuncirculo -->
<g>
  <circle cx="390" cy="80" r="52" fill="#059669" opacity="0.07"/>
  <circle cx="390" cy="80" r="52" fill="none" stroke="#059669" stroke-width="2"/>
  <circle cx="352" cy="44" r="5" fill="#059669"/>
  <circle cx="441" cy="67" r="5" fill="#059669"/>
  <circle cx="374" cy="129" r="5" fill="#059669"/>
  <path d="M352,44 L441,67 L374,129 Z" fill="none" stroke="#059669" stroke-width="1.3" stroke-dasharray="4 3"/>
  <circle class="pt" cx="385" cy="70" r="3.5"/>
  <circle class="pt" cx="405" cy="95" r="3.5"/>
  <circle cx="390" cy="80" r="2.5" fill="#059669"/>
  <text class="tx" x="322" y="166" fill="#059669">3 puntos en el borde</text>
  <text class="mn" x="322" y="182">es el circuncirculo de esa terna</text>
</g>

<text class="mn" x="196" y="78">el MEC siempre queda</text>
<text class="mn" x="196" y="94">determinado por 2 o por</text>
<text class="mn" x="196" y="110">3 de los puntos</text>
</svg>
